name: Security regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: node --test tests/evidence-security.test.cjs
      - run: python -m pip install -r apps/api/requirements_core.txt httpx==0.28.1
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r apps/api/requirements_core.txt
